[project]
name = "pipeline-twin"
version = "0.1.0"
description = "Academic natural-gas pipeline digital twin"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "scipy>=1.13,<2", "paho-mqtt>=2.1,<3", "scikit-learn>=1.6,<2", "joblib>=1.4,<2"]

[project.optional-dependencies]
xgboost = ["xgboost-cpu>=3,<4"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
