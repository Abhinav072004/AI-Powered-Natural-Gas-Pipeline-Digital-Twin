name: CI and GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Test and build dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies and run tests
        run: |
          python -m pip install uv==0.13.6
          uv sync --locked --no-install-project --extra xgboost
          uv run --no-sync pytest -q

      - name: Train models and export public simulation data
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          uv run --no-sync python -m pipeline_twin.simulation dataset
          uv run --no-sync python -m pipeline_twin.detection --xgboost
          uv run --no-sync python -m pipeline_twin.maintenance
          uv run --no-sync python -m scripts.export_pages

      - name: Build static dashboard
        env:
          VITE_DEPLOY_TARGET: pages
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build -- --base ./

      - name: Exercise all seven views under a project path
        run: |
          site_root="$(mktemp -d)"
          repository="${GITHUB_REPOSITORY#*/}"
          cp -R frontend/dist "$site_root/$repository"
          python -m http.server 8080 --bind 127.0.0.1 --directory "$site_root" &
          server=$!
          trap 'kill "$server"' EXIT
          url="http://127.0.0.1:8080/$repository/"
          curl --retry 5 --retry-connrefused --fail --silent --show-error "$url" -o /dev/null
          CHROMIUM_PATH="$(command -v google-chrome)" TWIN_BASE="$url" TWIN_MODE=pages npm --prefix frontend run smoke:browser

      - name: Bundle dashboard connected to configured backend
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.TWIN_API_BASE_URL != ''
        env:
          VITE_DEPLOY_TARGET: pages
          VITE_API_BASE_URL: ${{ vars.TWIN_API_BASE_URL }}
        run: npm --prefix frontend run build -- --base ./

      - name: Upload site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  integration:
    name: Test MQTT, TimescaleDB and FastAPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEMETRY_STALE_AFTER_S: '15'
    steps:
      - uses: actions/checkout@v5
      - name: Start Docker Compose
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Run live telemetry smoke test
        run: |
          docker compose run --rm --no-deps publisher \
            --scenario large_leak --period 0.6 --steps 24 --run-id actions-smoke &
          publisher=$!
          result=0
          python3 scripts/smoke.py --run-id actions-smoke --expect-stale || result=$?
          wait "$publisher"
          exit "$result"
      - name: Report service logs
        if: failure()
        run: docker compose logs --tail 150
      - name: Stop stack
        if: always()
        run: docker compose down

  deploy:
    name: Deploy to GitHub Pages
    needs: [web, integration]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish static site
        id: deployment
        uses: actions/deploy-pages@v4
